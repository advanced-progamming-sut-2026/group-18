tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:$tenPatchVersion"
  api "com.esotericsoftware:kryo:$kryoVersion"

  implementation "de.mkammerer:argon2-jvm:$argon2Version"
  implementation "com.github.pizpizi:pvz-skin:$pvzSkinVersion"
  implementation "com.github.pizpizi:libPVZ:$libPvzVersion"
  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

// 1. Standard thin jar (required by :lwjgl3 for core class dependencies)
jar {
  archiveFileName.set("core-${projectVersion}.jar")
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// 2. Dedicated runnable Server Fat JAR + Terminal Launcher
tasks.register('serverJar', Jar) {
  archiveFileName.set("${appName}-server-${projectVersion}.jar")
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  from sourceSets.main.output

  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }

  manifest {
    attributes(
      'Main-Class': 'com.compileordie.pvz2.server.Server',
      'Enable-Native-Access': 'ALL-UNNAMED',
      'Multi-Release': 'true'
    )
  }

  doLast {
    File batFile = new File(destinationDirectory.get().asFile, "run-server.bat")
    batFile.text = """@echo off
title PVZ2 Dedicated Server
java --enable-native-access=ALL-UNNAMED -jar "${archiveFileName.get()}"
echo.
echo ========================================================
echo Server process has stopped.
echo ========================================================
pause
"""
  }
}
